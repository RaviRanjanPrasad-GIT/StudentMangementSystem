name: Student Management CI/CD

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore project
        run: dotnet restore ./StudentManagementConsoleApplication.csproj

      - name: Build project
        run: dotnet build ./StudentManagementConsoleApplication.csproj --configuration Release --no-restore

      - name: Publish project
        if: github.event_name != 'pull_request'
        run: dotnet publish ./StudentManagementConsoleApplication.csproj --configuration Release --no-build --no-restore --output ./publish

      - name: Upload published artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: StudentManagementConsoleApplication
          path: ./publish/
          if-no-files-found: error